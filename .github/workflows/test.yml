name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        zig-version: ['0.16.0', '0.17.0']

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Zig
      uses: mlugg/setup-zig@v2
      with:
        version: ${{ matrix.zig-version }}

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Setup Node
      uses: actions/setup-node@v4
      with:
        node-version: '22'

    - name: Build grammar
      working-directory: editor/tree-sitter-zt
      run: |
        npm ci
        npx tree-sitter generate
        npx tree-sitter build

    - name: Install pytest
      run: pip install pytest

    - name: Run check script
      run: ./check.sh --ci --full
      timeout-minutes: 5
      env:
        TEST_VERBOSE: true
