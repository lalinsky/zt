name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Zig
      uses: mlugg/setup-zig@v2
      with:
        version: 0.15.0

    - name: Run check script
      run: ./check.sh --ci
      timeout-minutes: 5
      env:
        TEST_VERBOSE: true
