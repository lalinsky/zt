name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        zig-version: ['0.16.0', '0.17.0']

    defaults:
      run:
        shell: bash

    steps:
    - name: Keep LF line endings
      if: runner.os == 'Windows'
      run: git config --global core.autocrlf false

    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Zig
      uses: mlugg/setup-zig@v2
      with:
        version: ${{ matrix.zig-version }}

    # The grammar and the integration tests check the generated code, which
    # doesn't depend on the platform, so they only run on Linux.
    - name: Setup Python
      if: runner.os == 'Linux'
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Setup Node
      if: runner.os == 'Linux'
      uses: actions/setup-node@v4
      with:
        node-version: '22'

    - name: Build grammar
      if: runner.os == 'Linux'
      working-directory: editor/tree-sitter-zt
      run: |
        npm ci
        npx tree-sitter generate
        npx tree-sitter build

    - name: Install pytest
      if: runner.os == 'Linux'
      run: pip install pytest

    - name: Run check script
      run: ./check.sh --ci ${{ runner.os == 'Linux' && '--full' || '' }}
      timeout-minutes: 10
      env:
        TEST_VERBOSE: true

    # The SIMD code in the runtime depends on how vectors map to integers,
    # which differs on big-endian targets.
    - name: Run unit tests on big-endian (s390x)
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y qemu-user-static
        zig build test -Dtarget=s390x-linux -fqemu --summary all
      timeout-minutes: 10
